[project]
name = "indec-mcp"
version = "0.2.0"
description = "Unofficial AI/MCP layer over the INDEC (Argentina) Catálogo API-INDEC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indec-sync = "indec_mcp.sync:main"
indec-mcp = "indec_mcp.server:main"
indec-mcp-http = "indec_mcp.hosted:main"
indec-stats = "indec_mcp.stats_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indec_mcp"]

# Ship the spec snapshot inside the package so installed (non-editable) copies can find it.
[tool.hatch.build.targets.wheel.force-include]
"spec/indec-openapi.json" = "indec_mcp/indec-openapi.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

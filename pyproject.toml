[project]
name = "indec-mcp"
version = "0.1.0"
description = "Unofficial AI/MCP layer over the INDEC (Argentina) Catálogo API-INDEC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indec-sync = "indec_mcp.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indec_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "indec-mcp"
version = "0.5.0"
description = "MCP server for Argentina's official statistics (INDEC): inflation, wages, poverty, trade, population. Unofficial."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MagcDEV" }]
keywords = ["mcp", "model-context-protocol", "indec", "argentina", "statistics", "inflation", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/MagcDEV/indec-mcp"
Documentation = "https://github.com/MagcDEV/indec-mcp/blob/main/docs/development.md"
Issues = "https://github.com/MagcDEV/indec-mcp/issues"
"Hosted server" = "https://indec-mcp-production.up.railway.app/mcp"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indec-sync = "indec_mcp.sync:main"
indec-mcp = "indec_mcp.server:main"
indec-mcp-http = "indec_mcp.hosted:main"
indec-stats = "indec_mcp.stats_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indec_mcp"]

# Ship the spec snapshot inside the package so installed (non-editable) copies can find it.
[tool.hatch.build.targets.wheel.force-include]
"spec/indec-openapi.json" = "indec_mcp/indec-openapi.json"

# Keep the sdist to what builds and tests the package (no data/, .env or docs media).
[tool.hatch.build.targets.sdist]
include = ["src", "spec", "tests", "README.md", "LICENSE", "PRIVACY.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
